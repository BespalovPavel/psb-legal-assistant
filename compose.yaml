services:
  db:
    image: postgres:16-alpine
    container_name: psb_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant} -d ${POSTGRES_DB:-legal_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: psb_assistant_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:-assistant}@db:5432/${POSTGRES_DB:-legal_assistant}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/documents || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: psb_assistant_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PSB_API_URL: "http://backend:8000"
      PSB_PROXY_TIMEOUT_MS: "200000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
